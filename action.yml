name: 'pii-br'
description: 'Escaneia o repo em busca de PII brasileira (CPF, CNPJ, RG, telefone, email, PIX)'
inputs:
  paths:
    description: 'Glob dos arquivos a escanear'
    required: false
    default: '**/*'
  fail-on-found:
    description: 'Falha o check se encontrar PII'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - shell: bash
      env:
        CLI: ${{ github.action_path }}/src/cli.js
        SCAN_PATHS: ${{ inputs.paths }}
      run: node "CLI""CLI" "CLI""SCAN_PATHS" --fail-on-found
