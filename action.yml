name: 'pii-br'
description: 'Escaneia o repo em busca de PII brasileira (CPF, CNPJ, RG, telefone, email, PIX)'
inputs:
  paths:
    description: 'Glob dos arquivos a escanear'
    required: false
    default: '**/*'
  fail-on-found:
    description: 'Falha o check se encontrar PII'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - shell: bash
      run: node "github.actionpath/src/cli.js""{{ github.action_path }}/src/cli.js" "github.actionp​ath/src/cli.js""{{ inputs.paths }}" --fail-on-found
